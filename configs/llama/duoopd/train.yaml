defaults:
- ppo_trainer
- _self_
hydra:
  searchpath:
  - file://${oc.env:VERL_ROOT}/verl/trainer/config
  run:
    dir: ${oc.env:RUN_DIR}/hydra
data:
  train_files: data/biology-chemistry-physics/train_verl.parquet
  val_files: data/biology-chemistry-physics/development_verl.parquet
  train_batch_size: 48
  max_prompt_length: 4096
  max_response_length: 1024
  filter_overlong_prompts: false
  truncation: error
  shuffle: false
  seed: 42
  return_raw_chat: true
  apply_chat_template_kwargs:
    date_string: 26 Jul 2024
  custom_cls:
    path: ${oc.env:PROJECT_SOURCE}/src/methods/duoopd/dataset.py
    name: ReferenceDataset
  dataloader_num_workers: 0
actor_rollout_ref:
  model:
    path: models/Llama-3.2-3B-Instruct
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    strategy: fsdp
    ppo_mini_batch_size: 48
    ppo_micro_batch_size_per_gpu: 4
    ppo_epochs: 1
    shuffle: false
    use_dynamic_bsz: false
    use_kl_loss: false
    entropy_coeff: 0
    loss_agg_mode: seq-mean-token-mean
    checkpoint:
      save_contents:
      - model
      - optimizer
      - extra
      - hf_model
    optim:
      lr: 3.0e-06
      weight_decay: 0.1
      betas:
      - 0.9
      - 0.95
      lr_scheduler_type: cosine
      lr_warmup_steps: 6
      override_optimizer_config:
        eps: 1.0e-08
    fsdp_config:
      model_dtype: fp32
      param_offload: false
      optimizer_offload: false
    data_loader_seed: 42
  rollout:
    name: vllm
    mode: async
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    n: 1
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.3
    max_model_len: 5120
    max_num_batched_tokens: 8192
    log_prob_micro_batch_size_per_gpu: 4
    calculate_log_probs: true
    seed: 42
custom_reward_function:
  path: ${oc.env:PROJECT_SOURCE}/src/evaluation/verifier.py
  name: verify_answer
algorithm:
  adv_estimator: duoopd
  use_kl_in_reward: false
  rollout_correction: null
  duoopd:
    online_mean_scope: task
trainer:
  project_name: DuoOPD
  experiment_name: ${oc.env:EXPERIMENT_ID}
  logger:
  - console
  nnodes: 1
  total_epochs: 1
  total_training_steps: 60
  balance_batch: false
  val_before_train: false
  test_freq: -1
  save_freq: 20
  max_actor_ckpt_to_keep: 1
  default_local_dir: ${oc.env:RUN_DIR}/train
  rollout_data_dir: ${oc.env:RUN_DIR}/rollouts
  use_legacy_worker_impl: enable
  n_gpus_per_node: 4
reward_model:
  enable: true
  use_reward_loop: false
  strategy: fsdp
  launch_reward_fn_async: false
  teacher_temperature: 1.0
  use_dynamic_bsz: false
  reference:
    path: data/teachers/llama.jsonl
    max_prompt_length: 5632
    apply_chat_template_kwargs:
      date_string: 26 Jul 2024
  micro_batch_size_per_gpu: 4
  model:
    path: models/Llama-3.1-8B-Instruct
    input_tokenizer: null
    use_remove_padding: true
    fsdp_config:
      model_dtype: bfloat16
      dtype: bfloat16
      param_offload: false
